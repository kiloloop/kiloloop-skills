# Snapshot of the synthetic fixture corpus shipped with memory-lint 0.1.0.
files:
  'config.yaml': |
    version: 1
    corpus_root: fixtures/clean

    profiles:
      notes:
        include:
          - notes/**/*.md
        checks:
          frontmatter:
            required_keys: [title, description, type]
            quoted_keys: [description]
            type_enum: [memory, note]
          links: true
          managed_markers:
            pairs:
              - begin: "<!-- BEGIN MANAGED -->"
                end: "<!-- END MANAGED -->"
          staleness:
            max_age_days: 30
            updated_required: true
          structure:
            max_line_length: 120

      indexes:
        include:
          - MEMORY.md
        checks:
          links: true
          structure:
            max_line_length: 120

    indexes:
      - path: MEMORY.md
        include:
          - notes/**/*.md
        exclude: []
  'fixtures/clean/MEMORY.md': |
    # Synthetic Memory Index

    - [Alpha](notes/alpha.md)
    - [Beta](notes/beta.md)
    - [Gamma](notes/nested/gamma.md)
  'fixtures/clean/notes/alpha.md': |
    ---
    title: Alpha
    description: "Synthetic alpha memory"
    type: memory
    ---

    *Updated:* 2026-08-01

    # Alpha

    Alpha links to [[beta]] and [Gamma](nested/gamma.md).

    <!-- BEGIN MANAGED -->
    This synthetic sentence is managed.
    <!-- END MANAGED -->
  'fixtures/clean/notes/beta.md': |
    ---
    title: Beta
    description: 'Synthetic beta note'
    type: note
    ---

    *Updated:* 2026-08-02

    # Beta

    Beta links back to [Alpha](alpha.md).
  'fixtures/clean/notes/nested/gamma.md': |
    ---
    title: Gamma
    description: "Synthetic nested note"
    type: note
    ---

    *Updated:* 2026-08-03

    # Gamma

    Gamma links to [[../alpha]].
  'fixtures/defects/MEMORY.md': |
    # Synthetic Defect Index

    - [Broken links](notes/broken-links.md)
